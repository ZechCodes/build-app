name: Trust regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: nice -n 10 python -S tests/security_trust_test.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - run: nice -n 10 node tests/node-trust.test.cjs
      - run: nice -n 10 npm ci --ignore-scripts
      - run: nice -n 10 node node_modules/electron/install.js
      - run: nice -n 10 node_modules/.bin/electron tests/node-trust.test.cjs
        env:
          ELECTRON_RUN_AS_NODE: '1'
